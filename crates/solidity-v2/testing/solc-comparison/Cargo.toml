[package]
name = "solidity_testing_solc_comparison"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# The semantic-test suite is a data-driven `datatest-stable` harness (one test
# per (version, test-file) pair). It is excluded from the default `infra test`
# run and executed via `infra verify` instead — see `dataset::dataset_root`.
[[test]]
name = "semantic_tests"
harness = false

[dependencies]
anyhow = { workspace = true }
flate2 = { workspace = true }
infra_utils = { workspace = true }
rayon = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slang_solidity_v2 = { workspace = true }
slang_solidity_v2_common = { workspace = true }
solidity_testing_utils = { workspace = true }
solidity_v2_testing_utils = { workspace = true }
tar = { workspace = true }

# Only the `semantic_tests` integration harness uses `datatest-stable`, not the
# library, so it's a dev-dependency (available to the test target).
[dev-dependencies]
datatest-stable = { workspace = true }

[lints]
workspace = true
