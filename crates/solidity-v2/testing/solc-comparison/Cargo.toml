[package]
name = "solidity_testing_solc_comparison"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# The suites are data-driven `datatest-stable` harnesses (one test per (version,
# test-file) pair). They are excluded from the default `infra test` run and
# executed via `infra verify` instead — see `dataset::dataset_root`.
[[test]]
name = "semantic_tests"
harness = false

[[test]]
name = "syntax_tests"
harness = false

[dependencies]
anyhow = { workspace = true }
flate2 = { workspace = true }
infra_utils = { workspace = true }
rayon = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slang_solidity_v2 = { workspace = true }
slang_solidity_v2_common = { workspace = true }
solidity_testing_utils = { workspace = true }
solidity_v2_testing_utils = { workspace = true }
tar = { workspace = true }

# Only the integration harnesses use `datatest-stable`, not the library, so it's
# a dev-dependency (available to the test targets).
[dev-dependencies]
datatest-stable = { workspace = true }

[lints]
workspace = true
