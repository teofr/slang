name: "benchmark_cargo_slang_v2"

# EXPERIMENT (temporary): measures how sensitive the gungraun numbers are to
# unrelated codegen changes, across code variants and build configurations.

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Unused by the experiment, kept for compatibility with the dispatch API."
        type: "boolean"
        required: true
        default: true

permissions: {}

jobs:
  benchmark:
    runs-on: "ubuntu-24.04" # _SLANG_DEV_CONTAINER_BASE_IMAGE_ (keep in sync)

    permissions:
      contents: "read"

    strategy:
      fail-fast: false
      matrix:
        code: ["bench/r-main", "bench/r-main-opt4", "bench/r-a", "bench/r-ak"]
        config: ["current", "cgu1", "nolto", "noinline"]

    name: "${{ matrix.config }} @ ${{ matrix.code }}"

    steps:
      - name: "Checkout Repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ matrix.code }}"
          persist-credentials: false
          fetch-depth: 0 # Full history is needed by 'git/restore-mtime' to find each file's last commit time.

      - name: "Setup"
        uses: "./.github/actions/common-setup"
        with:
          task-setup-args: "setup:cargo setup:pipenv"
          sfw-optional: "true"

      - name: "Select build configuration"
        run: |
          case "${{ matrix.config }}" in
            current) ;;
            cgu1) echo "CARGO_PROFILE_BENCH_CODEGEN_UNITS=1" >> "$GITHUB_ENV" ;;
            nolto) echo "CARGO_PROFILE_BENCH_LTO=false" >> "$GITHUB_ENV" ;;
            noinline) echo "RUSTFLAGS=-C llvm-args=-inline-threshold=0" >> "$GITHUB_ENV" ;;
            *) echo "unknown config"; exit 1 ;;
          esac

      - name: "Benchmark > infra perf cargo slang-v2"
        run: "env -u BENCHER_API_KEY ./scripts/bin/infra perf cargo --dry-run slang-v2 2>&1 | tee bench.log"
        env:
          SLANG_PERF_SKIP_DHAT: "1"

      - name: "Results"
        run: |
          awk '/^slang_v2::pipeline::/ { id = $1 " " $2 } /Instructions:/ && id { split($2, a, "|"); ir = a[1] } /Estimated Cycles:/ && id { split($3, a, "|"); if (!(id in seen)) print "RESULT\t" id "\t" ir "\t" a[1]; seen[id] = 1; id = "" }' bench.log
          for f in $(find target/gungraun -name 'callgrind.*.out' | grep -E 'callgrind\.(infer_language_versions\.(uniswap|pointer_libraries)|parser\.uniswap)\.out' | sort); do
            echo "=== PROFILE $f"
            callgrind_annotate --inclusive=no --threshold=95 "$f" | sed -n '1,60p'
          done
