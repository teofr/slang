name: "experiment_env_sensitivity"

# EXPERIMENT (temporary): does the same bench binary report different numbers
# when only the size of the environment (and thus the initial stack/heap
# addresses) changes?

on:
  workflow_dispatch:

permissions: {}

jobs:
  env-sensitivity:
    runs-on: "ubuntu-24.04" # _SLANG_DEV_CONTAINER_BASE_IMAGE_ (keep in sync)

    permissions:
      contents: "read"

    steps:
      - name: "Checkout Repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: "Setup"
        uses: "./.github/actions/common-setup"
        with:
          task-setup-args: "setup:cargo setup:pipenv"
          sfw-optional: "true"

      - name: "Install deps and build"
        run: "./scripts/bin/infra perf cargo --smoke slang-v2"

      - name: "Run with different environment sizes"
        run: |
          for pad in 0 1 3 8 13 64 1000; do
            padding=$(head -c "$pad" /dev/zero | tr '\0' 'x')
            SLANG_PAD="$padding" SLANG_PERF_SKIP_DHAT=1 GUNGRAUN_PARALLEL=4 \
              ./scripts/bin/with-hermit cargo bench --package solidity_testing_perf_cargo --bench slang_v2 > "pad-$pad.log" 2>&1 || { tail -50 "pad-$pad.log"; exit 1; }
            awk -v pad="$pad" '/^slang_v2::pipeline::/ { id = $1 " " $2 } /Instructions:/ && id { split($2, a, "|"); ir = a[1] } /Estimated Cycles:/ && id { split($3, a, "|"); print "RESULT\t" pad "\t" id "\t" ir "\t" a[1]; id = "" }' "pad-$pad.log"
          done
