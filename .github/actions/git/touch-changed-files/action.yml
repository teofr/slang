name: "git/touch-changed-files"
description: >
  Set the mtime of every file changed by the current pull request to "now", so
  cargo treats them as newer than artifacts restored from the shared cargo-target
  cache and recompiles them. Only meaningful on pull_request events; must run
  after 'git/restore-mtime'.

runs:
  using: "composite"
  steps:
    # 'git/restore-mtime' rewrites every file's mtime to its last-commit time. The
    # cargo-target cache PRs restore from is built on 'main' (see ci.yml), whose
    # commits are usually newer than a PR's. A file the PR changed therefore ends
    # up with an mtime OLDER than the cached artifact built from main's version of
    # it, so cargo wrongly considers it fresh and skips recompiling the PR's change.
    # Bumping each PR-changed file's mtime to "now" forces cargo to rebuild them.
    - name: "Touch PR-changed files"
      shell: "bash"
      env:
        # HEAD is the PR merge commit, so diffing against the base branch tip
        # yields exactly the files the PR adds or modifies.
        BASE_SHA: "${{ github.event.pull_request.base.sha }}"
      run: |
        # --diff-filter=d drops deletions (nothing on disk to touch); -z/-0 keeps
        # paths with spaces or other special characters intact.
        git diff --name-only --diff-filter=d -z "${BASE_SHA}" HEAD \
          | xargs -0 --no-run-if-empty touch -c -m --
